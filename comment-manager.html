<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment Manager | India Jobs Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#19334d;font:16px Arial}header{background:#12355b;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1100px;width:94%;margin:25px auto}.card{background:white;border:1px solid #dbe5ef;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #12355b0c}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd8e5;border-radius:8px;font:inherit;margin:6px 0 12px}textarea{min-height:100px}button,.btn{border:0;border-radius:8px;padding:11px 15px;background:#1769aa;color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}button.danger{background:#b42318}button.ok{background:#15803d}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.item{border:1px solid #dbe5ef;border-radius:10px;padding:14px;margin:10px 0}.muted{color:#66788a;font-size:13px}#msg{color:#b42318;white-space:pre-wrap}</style></head><body><header><div><b>India Jobs Portal</b><div>Comment Manager</div><small id="who"></small></div><div><a class="btn" href="admin-dashboard.html">Admin Dashboard</a><button id="logout">Logout</button></div></header><main><section id="loginbox" class="card"><h2>Admin Login</h2><p>Verified India Jobs Portal admin account se login karein.</p><button id="login">Login with Google</button><p id="msg"></p></section><section id="app" hidden><section class="card"><h2>💬 Comment Moderation</h2><p class="muted">Approve comments to show them publicly, or delete spam.</p><button id="refresh">Refresh</button><div id="items">Loading…</div></section><p id="msg"></p></section></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCh20UGNM3-tWZiB6pkNUXcbWK-lwkc-sU",authDomain:"india-jobs-portal.firebaseapp.com",projectId:"india-jobs-portal",storageBucket:"india-jobs-portal.firebasestorage.app",messagingSenderId:"1035209974762",appId:"1:1035209974762:web:622a242e1a291c4b604893",measurementId:"G-XSH6QC1PG4"};
const app=initializeApp(firebaseConfig,document.title.replace(/[^a-z0-9]/gi,'-').toLowerCase());const auth=getAuth(app),db=getFirestore(app);const ADMIN="saif.anwar1618@gmail.com";const $=id=>document.getElementById(id);let user=null;
$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('msg').textContent=e.message);$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(!u){$('loginbox').hidden=false;$('app').hidden=true;return;}if((u.email||'').toLowerCase()!==ADMIN){$('msg').textContent='This account is not authorised.';signOut(auth);return;}user=u;$('loginbox').hidden=true;$('app').hidden=false;$('who').textContent=u.email;load().catch(e=>$('msg').textContent='Load error: '+e.message);});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const s=await getDocs(collection(db,'comments'));const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));$('items').innerHTML=a.length?a.map(x=>`<article class="item"><b>${esc(x.name)}</b> · <span>${esc(x.status)}</span><p style="white-space:pre-wrap">${esc(x.comment)}</p><div><button class="ok" onclick="window.approve('${x.id}')">Approve</button><button class="danger" onclick="window.del('${x.id}')">Delete</button></div></article>`).join(''):'<p>No comments.</p>';}
window.approve=async id=>{await updateDoc(doc(db,'comments',id),{status:'approved',reviewedAt:serverTimestamp()});await load();};window.del=async id=>{if(confirm('Delete comment?')){await deleteDoc(doc(db,'comments',id));await load();}};$('refresh').onclick=load;
</script></body></html>
