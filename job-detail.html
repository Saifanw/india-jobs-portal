<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Job Details | India Jobs Portal</title>
<meta name="description" content="View verified job details and official application links on India Jobs Portal.">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#182536}
.wrap{width:min(900px,92%);margin:auto}.top{background:#102a43;color:#fff;padding:16px 0}
.card{background:#fff;margin:35px 0;padding:28px;border-radius:18px;border:1px solid #dfe7ef;box-shadow:0 10px 30px #102a430d}
h1{color:#102a43;margin-bottom:7px}.company{color:#64748b;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.meta span{border:1px solid #dfe7ef;padding:8px 10px;border-radius:8px;font-size:13px}
.btn{display:inline-block;background:#1769e8;color:#fff;padding:12px 18px;border-radius:9px;text-decoration:none;font-weight:800}
.section{border-top:1px solid #e5ebf1;margin-top:24px;padding-top:20px}.note{font-size:12px;color:#64748b}.error{text-align:center;padding:30px}
</style>
</head>
<body>
<div class="top"><div class="wrap"><b>India Jobs Portal</b> • Job Details</div></div>
<main class="wrap"><div class="card" id="content"><div class="error">Loading job details…</div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCh20UGNM3-tWZiB6pkNUXcbWK-lwkc-sU",
  authDomain: "india-jobs-portal.firebaseapp.com",
  projectId: "india-jobs-portal",
  storageBucket: "india-jobs-portal.firebasestorage.app",
  messagingSenderId: "1035209974762",
  appId: "1:1035209974762:web:622a242e1a291c4b604893",
  measurementId: "G-XSH6QC1PG4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const content = document.getElementById("content");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const id = new URLSearchParams(location.search).get("id");

function safeUrl(value) {
  try {
    const u = new URL(String(value || ""));
    return ["https:", "http:"].includes(u.protocol) ? u.href : "";
  } catch { return ""; }
}

async function load() {
  if (!id) {
    content.innerHTML = '<div class="error"><h2>Job not found</h2><a class="btn" href="jobs.html">Back to Jobs</a></div>';
    return;
  }
  try {
    const snap = await getDoc(doc(db, "jobs", id));
    if (!snap.exists() || snap.data().status !== "approved") {
      content.innerHTML = '<div class="error"><h2>Job not available</h2><p>This vacancy may still be under review or may have expired.</p><a class="btn" href="jobs.html">Back to Jobs</a></div>';
      return;
    }
    const j = snap.data();
    document.title = `${j.title || "Job Details"} | India Jobs Portal`;
    const applyUrl = safeUrl(j.apply || j.applyLink);
    content.innerHTML = `
      <h1>${esc(j.title)}</h1>
      <div class="company">${esc(j.company)} • 📍 ${esc(j.location)}</div>
      <div class="meta">
        <span>💼 ${esc(j.type || j.jobType || "Full Time")}</span>
        <span>👤 ${esc(j.experience || "Any Experience")}</span>
        <span>💰 ${esc(j.salary || "Not specified")}</span>
        <span>🎓 ${esc(j.qualification || "Not specified")}</span>
        ${j.deadline || j.lastDate ? `<span>📅 Deadline: ${esc(j.deadline || j.lastDate)}</span>` : ""}
      </div>
      ${applyUrl ? `<a class="btn" href="${esc(applyUrl)}" target="_blank" rel="noopener noreferrer">Apply Now ↗</a>` : `<p><b>Application link is not available. Please check the job notice.</b></p>`}
      <div class="section"><h2>Job Description</h2><p>${esc(j.description || "Details not provided.").replace(/\n/g,"<br>")}</p></div>
      ${j.notes ? `<div class="section"><h2>Additional Information</h2><p>${esc(j.notes).replace(/\n/g,"<br>")}</p></div>` : ""}
      <p class="note">Please verify vacancy details and the application route before applying.</p>
      <p><a href="jobs.html">← Back to all jobs</a></p>`;
  } catch (e) {
    console.error(e);
    content.innerHTML = '<div class="error"><h2>Unable to load this job</h2><p>Please check your internet connection and Firestore rules.</p><a class="btn" href="jobs.html">Back to Jobs</a></div>';
  }
}
load();
</script>
</body>
</html>
