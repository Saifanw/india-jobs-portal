<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes & Practice | India Jobs Portal</title><style>
:root{--navy:#102a43;--blue:#1769e8;--bg:#f3f6fb;--line:#dbe4ef;--ink:#182536;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 Inter,Arial,sans-serif}header{background:linear-gradient(120deg,#102a43,#174a76);color:#fff;padding:24px max(18px,calc((100% - 1200px)/2))}header h1{margin:0;font-size:clamp(25px,3vw,34px)}header p{margin:5px 0 10px;color:#dbeafe}header a{color:white}main{max-width:1200px;margin:22px auto;padding:0 16px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 4px 16px #17324d08}.filters{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}.filters label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.chapterLink{display:block;padding:11px 12px;border:1px solid transparent;border-bottom-color:#e5eaf1;color:#1769e8;cursor:pointer;text-decoration:none;border-radius:8px}.chapterLink:hover,.chapterLink.active{background:#eff6ff;border-color:#bfdbfe}.chapterLink small{display:block;color:#64748b;font-size:12px}.muted{color:var(--muted)}.lessonContent{overflow-wrap:anywhere}.lessonContent img{max-width:100%;height:auto}.lessonContent table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}.lessonContent th,.lessonContent td{border:1px solid #cbd5e1;padding:8px}.empty{padding:20px;color:var(--muted);background:#f8fafc;border-radius:10px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.count{font-size:12px;color:var(--muted)}@media(max-width:780px){.layout{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><header><h1>Notes & Practice</h1><p>India Jobs Portal · Subject-wise, chapter-wise learning</p><a href="index.html">← Back to portal</a></header><main><div class="layout"><aside class="card"><div class="topline"><h2 style="margin:0">Published chapters</h2><span class="count" id="count"></span></div><div class="filters"><div><label for="subjectFilter">Filter by subject</label><select id="subjectFilter" onchange="renderNav()"><option value="">All subjects</option></select></div><div><label for="chapterFilter">Chapter number</label><select id="chapterFilter" onchange="renderNav()"><option value="">All chapters</option></select></div><div><label for="search">Search notes</label><input id="search" placeholder="Search chapter title…" oninput="renderNav()"></div></div><div id="nav">Loading published chapters…</div></aside><section><article class="card" id="lesson"><h2>Choose a chapter</h2><p class="muted">Select a published chapter from the list.</p></article></section></div></main>
<script>
let all=[],activeId=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeHtml(input){const doc=new DOMParser().parseFromString(String(input||''),'text/html'),allowed=new Set(['P','BR','DIV','SPAN','B','STRONG','I','EM','U','S','H2','H3','H4','UL','OL','LI','BLOCKQUOTE','HR','A','TABLE','THEAD','TBODY','TR','TH','TD']);function walk(root){[...root.childNodes].forEach(n=>{if(n.nodeType===1){if(!allowed.has(n.tagName)){n.replaceWith(...n.childNodes);return}[...n.attributes].forEach(a=>{if(n.tagName==='A'&&a.name==='href'){if(!/^https?:\/\//i.test(a.value))n.removeAttribute('href')}else if(n.tagName==='SPAN'&&a.name==='style'){let color=n.style.color;n.removeAttribute('style');if(/^#[0-9a-f]{3,8}$/i.test(color)||/^rgb\(/i.test(color))n.style.color=color;else n.removeAttribute('style')}else n.removeAttribute(a.name)});if(n.tagName==='A'){n.setAttribute('rel','noopener noreferrer');n.setAttribute('target','_blank')}walk(n)}else if(n.nodeType!==3)n.remove()})}walk(doc.body);return doc.body.innerHTML}
function getContent(c){let raw=String(c.content||'');return /<\/?(p|div|br|h[1-6]|ul|ol|li|strong|b|em|i|u|table|blockquote)\b/i.test(raw)?safeHtml(raw):esc(raw).replace(/\r?\n/g,'<br>')}
fetch('notes-content.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{all=(d.chapters||[]).filter(c=>c.status==='Published').map((c,i)=>({...c,chapterNumber:Number(c.chapterNumber)||Number(c.order)||i+1})).sort((a,b)=>String(a.subject).localeCompare(String(b.subject))||a.chapterNumber-b.chapterNumber||Number(a.order)-Number(b.order));let ss=[...new Set(all.map(c=>c.subject).filter(Boolean))].sort();$('subjectFilter').innerHTML='<option value="">All subjects</option>'+ss.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');renderNav()}).catch(()=>$('nav').textContent='Could not load notes-content.json.');
function renderNav(){let s=$('subjectFilter').value,q=$('search').value.trim().toLowerCase();let nums=[...new Set(all.filter(c=>!s||c.subject===s).map(c=>c.chapterNumber))].sort((a,b)=>a-b),old=$('chapterFilter').value;$('chapterFilter').innerHTML='<option value="">All chapters</option>'+nums.map(n=>`<option value="${n}">Chapter ${n}</option>`).join('');if(nums.includes(Number(old)))$('chapterFilter').value=old;let n=$('chapterFilter').value,arr=all.filter(c=>(!s||c.subject===s)&&(!n||c.chapterNumber===Number(n))&&(!q||`${c.title} ${c.description} ${c.subject}`.toLowerCase().includes(q)));$('count').textContent=arr.length+' chapters';$('nav').innerHTML=arr.length?arr.map(c=>`<a class="chapterLink ${c.id===activeId?'active':''}" onclick="openChapter('${esc(c.id)}')"><small>${esc(c.subject)} · Chapter ${c.chapterNumber}</small>${esc(c.title)}</a>`).join(''):'<div class="empty">No published chapters match your filters.</div>'}
function openChapter(id){let c=all.find(x=>x.id===id);if(!c)return;activeId=id;let html=`<small class="muted">${esc(c.subject)} · Chapter ${c.chapterNumber}</small><h2>${esc(c.title)}</h2>${c.description?`<p class="muted">${esc(c.description)}</p>`:''}<hr><div class="lessonContent">${getContent(c)}</div>`;$('lesson').innerHTML=html;renderNav();if(window.innerWidth<780)$('lesson').scrollIntoView({behavior:'smooth',block:'start'})}
</script></body></html>
