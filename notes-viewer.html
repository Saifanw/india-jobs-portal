<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reasoning Notes | India Jobs Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182536;font:16px/1.75 Arial,sans-serif}header{background:#102a43;color:#fff;padding:20px}main{max-width:1100px;margin:22px auto;padding:0 14px}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.card{background:white;border:1px solid #dbe4ef;border-radius:14px;padding:20px;margin-bottom:14px}.chapterLink{display:block;padding:10px;border-bottom:1px solid #e5eaf1;color:#1769e8;cursor:pointer}.chapterLink:hover{background:#f1f6ff}.muted{color:#64748b}.q{border:1px solid #dbe4ef;border-radius:10px;padding:14px;margin:12px 0}.opt{display:block;padding:8px;margin:6px 0;border:1px solid #dbe4ef;border-radius:8px;cursor:pointer}.feedback{display:none;background:#effaf3;padding:10px;border-radius:8px;margin-top:8px}button{background:#1769e8;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>Reasoning Notes & Practice</h1><p>India Jobs Portal · Chapter-wise learning</p><a href="index.html" style="color:white">← Back to portal</a></header><main><div class="layout"><aside class="card"><h2>Published chapters</h2><div id="nav">Loading chapters…</div></aside><section><article class="card" id="lesson"><h2>Choose a chapter</h2><p class="muted">Select a published chapter from the left.</p></article></section></div></main><script>
let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('notes-content.json').then(r=>r.json()).then(d=>{all=(d.chapters||[]).filter(c=>c.status==='Published').sort((a,b)=>(a.order||0)-(b.order||0));document.getElementById('nav').innerHTML=all.length?all.map(c=>`<a class="chapterLink" onclick="openChapter('${c.id}')">${esc(c.subject)}: ${esc(c.title)}</a>`).join(''):'<p class="muted">No chapters published yet. The administrator can publish notes using Notes Manager.</p>'}).catch(()=>document.getElementById('nav').textContent='Could not load notes-content.json.');
function openChapter(id){let c=all.find(x=>x.id===id);if(!c)return;let html=`<small>${esc(c.subject)}</small><h2>${esc(c.title)}</h2><p class="muted">${esc(c.description)}</p><hr><div style="white-space:pre-wrap">${esc(c.content)}</div>`;if(c.questions?.length){html+='<h2>Chapter Practice</h2>'+c.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${(q.options||[]).map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${'ABCD'[j]}"> ${'ABCD'[j]}. ${esc(o)}</label>`).join('')}<button onclick="check(${i})">Check answer</button><div class="feedback" id="f${i}">Correct answer: ${esc(q.answer)}<br>${esc(q.explanation)}</div></div>`).join('')};document.getElementById('lesson').innerHTML=html;window.currentQuestions=c.questions||[]}
function check(i){let q=window.currentQuestions[i],v=document.querySelector(`input[name="q${i}"]:checked`),f=document.getElementById('f'+i);f.style.display='block';f.style.background=v&&v.value===q.answer?'#effaf3':'#fff4e5';f.innerHTML=(v&&v.value===q.answer?'Correct!':'Review the answer:')+' Correct answer: '+esc(q.answer)+'<br>'+esc(q.explanation)}
</script></body></html>
