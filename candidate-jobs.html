<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your Matched Jobs | India Jobs Portal"><meta name="description" content="Job opportunities matched to your profile on India Jobs Portal."><style>
:root{--navy:#102a43;--blue:#1769e8;--bg:#f5f8fc;--line:#dce5ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#182536}.top{background:linear-gradient(135deg,#102a43,#1769e8);color:white;padding:22px 4%}.wrap{width:min(900px,92%);margin:auto}.top h1{margin:0 0 7px}.top p{margin:0;color:#e4efff}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;margin:22px 0;box-shadow:0 8px 25px #102a430b}.job{border:1px solid var(--line);border-radius:12px;padding:17px;margin:12px 0;background:#fbfdff}.job h2{font-size:19px;margin:0 0 6px;color:var(--navy)}.muted{color:var(--muted);font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{background:#eef4fa;border:1px solid var(--line);border-radius:20px;padding:6px 9px;font-size:12px}.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:10px 15px;border-radius:8px;font-weight:800;margin:5px 5px 0 0}.secondary{background:#eef4fa;color:var(--navy)}.status{padding:20px;text-align:center;color:var(--muted)}
</style></head><body><header class="top"><div class="wrap"><h1>India Jobs Portal</h1><p>Job opportunities selected for your profile</p></div></header><main class="wrap"><section class="card"><h2>Your matched jobs</h2><p class="muted">These approved vacancies were shared with you by India Jobs Portal. Please review the details and apply through the listed application link.</p><div id="jobs"><div class="status">Loading your selected jobs…</div></div><p class="muted">Please verify the vacancy details on the employer's official application page before sharing personal or payment information.</p><a class="btn secondary" href="index.html">Home</a><a class="btn secondary" href="jobs.html">Browse all jobs</a></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",authDomain:"rajasthan-job.firebaseapp.com",projectId:"rajasthan-job",storageBucket:"rajasthan-job.firebasestorage.app",messagingSenderId:"894888753938",appId:"1:894888753938:web:92e66d7a7237be1fd9d1cb",measurementId:"G-15S2XJQK80"};
const db=getFirestore(initializeApp(firebaseConfig,"public-candidate-matches")),root=document.getElementById('jobs');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=[...new Set((new URLSearchParams(location.search).get('jobs')||'').split(',').map(x=>x.trim()).filter(x=>/^[A-Za-z0-9_-]{5,}$/.test(x)))].slice(0,30);
async function load(){if(!ids.length){root.innerHTML='<div class="status">This link does not contain any selected jobs. Please contact India Jobs Portal for an updated link.</div>';return}try{const results=await Promise.all(ids.map(async id=>{try{const s=await getDoc(doc(db,'jobs',id));return s.exists()&&String(s.data().status||'').toLowerCase()==='approved'?{id,...s.data()}:null}catch(e){return null}}));const jobs=results.filter(Boolean);if(!jobs.length){root.innerHTML='<div class="status">These jobs are no longer available or could not be loaded. Please browse the latest vacancies.</div>';return}root.innerHTML=jobs.map(j=>{const apply=String(j.apply||j.applyLink||'');const safeApply=/^https?:\/\//i.test(apply)?apply:'';return `<article class="job"><h2>${esc(j.title||'Job Vacancy')}</h2><b>${esc(j.company||'Company not specified')}</b><div class="muted">📍 ${esc(j.location||'Location not specified')}</div><div class="tags"><span class="tag">${esc(j.type||j.jobType||'Full Time')}</span><span class="tag">${esc(j.experience||'Experience not specified')}</span><span class="tag">${esc(j.salary||'Salary not specified')}</span>${j.deadline||j.lastDate?`<span class="tag">Last date: ${esc(j.deadline||j.lastDate)}</span>`:''}</div><p>${esc(j.description||'Please open the employer application page for complete details.').replace(/\n/g,'<br>')}</p>${safeApply?`<a class="btn" href="${esc(safeApply)}" target="_blank" rel="noopener noreferrer">Apply Now ↗</a>`:'<span class="muted">Application link not provided. Contact the portal for details.</span>'}</article>`}).join('')}catch(e){root.innerHTML='<div class="status">Unable to load jobs right now. Please try again later.</div>';console.error(e)}}load();
</script></body></html>
